[project]
name = "oes-laboratorio"
version = "2.0.0"
description = "Prototipo académico de Observatorio de Educación Superior (Práctica Guiada N.° 08, UNDC)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
extend-exclude = ["guia_original"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = ["PLR2004", "PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]
